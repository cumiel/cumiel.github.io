<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cumiel - Apps</title>
  <meta name="description" content="Apps by Cumiel. CatchWave and more.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A0A0C;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 80px 20px 20px;
    }
    .header h1 {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    .header h1 span {
      background: linear-gradient(135deg, #818CF8, #6366F1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      font-size: 17px;
      color: rgba(255,255,255,0.4);
    }

    /* App Grid */
    .app-grid {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      width: 100%;
    }
    .app-card {
      background: #141418;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 32px;
      text-decoration: none;
      color: #fff;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }
    .app-card:hover {
      transform: translateY(-4px);
      border-color: rgba(129, 140, 248, 0.3);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    .app-info h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .app-info p {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      line-height: 1.5;
    }
    .app-tag {
      display: inline-block;
      background: rgba(129, 140, 248, 0.12);
      color: #818CF8;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 4px;
    }

    /* Coming soon card */
    .app-card.coming-soon {
      border-style: dashed;
      opacity: 0.5;
      cursor: default;
    }
    .app-card.coming-soon:hover {
      transform: none;
      border-color: rgba(255,255,255,0.06);
      box-shadow: none;
    }
    .placeholder-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      background: #1A1A1F;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: rgba(255,255,255,0.15);
    }

    /* Footer */
    footer {
      margin-top: auto;
      text-align: center;
      padding: 40px 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.25);
      font-size: 13px;
    }
    footer a {
      color: #818CF8;
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      .header { padding: 60px 20px 16px; }
      .header h1 { font-size: 30px; }
      .app-grid {
        grid-template-columns: 1fr;
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1><span>Cumiel</span></h1>
    <p>Simple apps, crafted with care.</p>
  </header>

  <section class="app-grid">
    <a href="catchwave.html" class="app-card">
      <img src="catchwave-icon.png" alt="CatchWave" class="app-icon">
      <div class="app-info">
        <h2>CatchWave</h2>
        <p>Listen to radio stations from around the world. KBS, MBC, SBS, NPR, BBC and more.</p>
      </div>
      <span class="app-tag">Radio</span>
    </a>

    <div class="app-card coming-soon">
      <div class="placeholder-icon">+</div>
      <div class="app-info">
        <h2>Coming Soon</h2>
        <p>New app in the works. Stay tuned!</p>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Cumiel Inc. All rights reserved.</p>
    <p style="margin-top: 8px;">
      <a href="mailto:contact@cumiel.com">Contact</a>
    </p>
  </footer>

</body>
</html>
